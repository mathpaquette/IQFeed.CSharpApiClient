image: Visual Studio 2022

version: '{build}'

install:
  - ps: |
      $ErrorActionPreference = "Stop"
      if ($env:APPVEYOR_REPO_TAG -eq "true") {
        if ($env:APPVEYOR_REPO_TAG_NAME -match '^v(\d+\.\d+\.\d+)$') {
          $PackageVersion = $Matches[1]
          $AssemblyVersion = $PackageVersion
        } else {
          throw "Release tag '$env:APPVEYOR_REPO_TAG_NAME' must match vMAJOR.MINOR.PATCH"
        }
      } else {
        $LatestVersion = git tag --list "v*" --merged HEAD |
          Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
          ForEach-Object { [version]$_.Substring(1) } |
          Sort-Object -Descending |
          Select-Object -First 1
        $NextVersion = if ($LatestVersion) { "$($LatestVersion.Major).$($LatestVersion.Minor).$($LatestVersion.Build + 1)" } else { "0.0.1" }
        $PackageVersion = "$NextVersion-ci.$env:APPVEYOR_BUILD_NUMBER"
        $AssemblyVersion = "$NextVersion.$env:APPVEYOR_BUILD_NUMBER"
      }
      Set-AppveyorBuildVariable -Name PACKAGE_VERSION -Value $PackageVersion
      Set-AppveyorBuildVariable -Name ASSEMBLY_VERSION -Value $AssemblyVersion
      Write-Host "Package version: $PackageVersion"

dotnet_csproj:
  patch: true
  file: '**\*.csproj'
  version: '$(PACKAGE_VERSION)'
  package_version: '$(PACKAGE_VERSION)'
  assembly_version: '$(ASSEMBLY_VERSION)'
  file_version: '$(ASSEMBLY_VERSION)'
  informational_version: '$(PACKAGE_VERSION)'

configuration: Release

before_build:
  - nuget restore
  - dotnet restore
  
test_script:
  - cmd: dotnet test .\src\IQFeed.CSharpApiClient.Tests\IQFeed.CSharpApiClient.Tests.csproj
  - cmd: dotnet test .\src\IQFeed.CSharpApiClient.Extensions.Tests\IQFeed.CSharpApiClient.Extensions.Tests.csproj
  - cmd: dotnet test .\src\IQFeed.CSharpApiClient.Extensions.Tests.Integration\IQFeed.CSharpApiClient.Extensions.Tests.Integration.csproj
  
build:
  project: IQFeed.CSharpApiClient.sln
  publish_nuget: true
  publish_nuget_symbols: true
  verbosity: normal

deploy:
  # Deploying to NuGet feed (MyGet.org)
  - provider: NuGet
    name: MyGet
    server: https://www.myget.org/F/iqfeedcsharpapiclient/api/v2/package
    api_key:
      secure: UBKXVuF4UwMea9mcl8hGLaHxOTBu3GNgzPvuEUWIzU+Nf6a8eTtBRyKITBepZl6i
    skip_symbols: false
    symbol_server: https://www.myget.org/F/iqfeedcsharpapiclient/symbols/api/v2/package
    artifact: /.*\.nupkg/

  # Deploying to NuGet feed (NuGet.org)
  - provider: NuGet
    name: NuGet
    on:
      appveyor_repo_tag: true
    server: https://www.nuget.org/api/v2/package
    api_key:
      secure: 5fQOqe+PO6WeHVsqBlVnNxK0FW1rJVhlbJ/8yW3pyIJGYBb3u+mICb4YS7U2ifFZ
    skip_symbols: true
    symbol_server: https://nuget.smbsrc.net/
    artifact: /.*\.nupkg/
